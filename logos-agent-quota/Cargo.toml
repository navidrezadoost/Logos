[package]
name = "logos-agent-quota"
version = "0.1.0"
edition = "2021"
description = "Agent Quota & Rate Limiting for Logos — per-tenant invocation caps, token budgets, and token-bucket rate limiting"
authors = ["Logos Contributors"]
license = "MPL-2.0"

[dependencies]
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
