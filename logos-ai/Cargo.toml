[package]
name = "logos-ai"
version = "0.1.0"
edition = "2021"
description = "AI-native design engine for Logos — ONNX inference, layout generation, style transfer, asset generation"

[dependencies]
logos-core = { path = "../logos-core" }
ndarray = "0.16"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "ai_benchmark"
harness = false
