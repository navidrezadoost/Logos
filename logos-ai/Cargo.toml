[package]
name = "logos-ai"
version = "0.2.0"
edition = "2021"
description = "AI-native design engine for Logos — ONNX inference, layout generation, style transfer, asset generation"

[features]
default = []
onnx = ["dep:ort"]

[dependencies]
logos-core = { path = "../logos-core" }
ndarray = "0.17"
thiserror = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
ort = { version = "2.0.0-rc.9", default-features = false, features = ["ndarray", "std", "download-binaries", "tls-native"], optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "ai_benchmark"
harness = false

[[bench]]
name = "onnx_benchmark"
harness = false
required-features = ["onnx"]
