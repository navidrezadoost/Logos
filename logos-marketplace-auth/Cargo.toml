[package]
name = "logos-marketplace-auth"
version = "0.1.0"
edition = "2021"
description = "Ed25519 publisher verification and authentication for Logos Marketplace"

[dependencies]
logos-core = { path = "../logos-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "auth_benchmark"
harness = false
