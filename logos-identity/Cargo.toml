[package]
name = "logos-identity"
version = "0.1.0"
edition = "2021"
description = "Unified identity, authentication, and permission layer for Logos"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
