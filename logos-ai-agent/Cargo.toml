[package]
name = "logos-ai-agent"
version = "0.1.0"
edition = "2021"
description = "AI Agent Integration for Logos — external LLM onboarding, curriculum training, certification, and RL-based UX assistance"

[features]
default = []
http = ["dep:reqwest"]

[dependencies]
logos-core = { path = "../logos-core" }
logos-ai = { path = "../logos-ai" }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
sha2 = "0.10"
reqwest = { version = "0.11", features = ["json", "blocking"], optional = true }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "agent_benchmark"
harness = false
