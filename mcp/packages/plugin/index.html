<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Logos plugin example</title>
    </head>
    <body>
        <label for="pairing-code">One-time pairing code</label>
        <input id="pairing-code" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" />
        <button type="button" data-appearance="secondary" data-handler="connect-mcp">Connect to MCP server</button>

        <div id="connection-status" style="margin-top: 10px; font-size: 12px; color: #666">Not connected</div>

        <script type="module" src="/src/main.ts"></script>
    </body>
</html>
