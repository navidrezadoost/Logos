networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 172.177.9.0/24

volumes:
  postgres_data_pg16:
  user_data:
  minio_data:
  valkey_data:

services:
  main:
    privileged: true
    image: "logos/devenv:latest"
    build:
      context: "."
    container_name: "logos-devenv-main"
    stop_signal: SIGINT

    depends_on:
      - postgres
      - redis
      # - keycloak

    volumes:
      - "user_data:/home/logos/"
      - "${PWD}:/home/logos/logos:z"

    ports:
      - "127.0.0.1:3447:3447"
      - "127.0.0.1:3448:3448"
      - "127.0.0.1:3449:3449"
      - "127.0.0.1:3449:3449/udp"
      - "127.0.0.1:3450:3450"
      - "127.0.0.1:6006:6006"
      - "127.0.0.1:6060:6060"
      - "127.0.0.1:6061:6061"
      - "127.0.0.1:6062:6062"
      - "127.0.0.1:6063:6063"
      - "127.0.0.1:6064:6064"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
      - "127.0.0.1:9090:9090"
      - "127.0.0.1:9091:9091"

      # Plugins
      - "127.0.0.1:4200:4200"
      - "127.0.0.1:4201:4201"
      - "127.0.0.1:4202:4202"

    environment:
      - EXTERNAL_UID=${CURRENT_USER_ID}
      - "LOGOS_MCP_LOCAL_TOKEN=${LOGOS_MCP_LOCAL_TOKEN:?Set a per-run LOGOS_MCP_LOCAL_TOKEN}"
      - LOGOS_MCP_SERVER_HOST=127.0.0.1
      - WS_URI=ws://127.0.0.1:3450/mcp/ws
      # SMTP setup
      - LOGOS_SMTP_ENABLED=true
      - LOGOS_SMTP_DEFAULT_FROM=no-reply@example.com
      - LOGOS_SMTP_DEFAULT_REPLY_TO=no-reply@example.com
      - LOGOS_SMTP_HOST=mailer
      - LOGOS_SMTP_PORT=1025
      - LOGOS_SMTP_USERNAME=
      - LOGOS_SMTP_PASSWORD=
      - LOGOS_SMTP_SSL=false
      - LOGOS_SMTP_TLS=false

      # LDAP setup
      - LOGOS_LDAP_HOST=ldap
      - LOGOS_LDAP_PORT=10389
      - LOGOS_LDAP_SSL=false
      - LOGOS_LDAP_STARTTLS=false
      - LOGOS_LDAP_BASE_DN=ou=people,dc=planetexpress,dc=com
      - LOGOS_LDAP_BIND_DN=cn=admin,dc=planetexpress,dc=com
      - LOGOS_LDAP_BIND_PASSWORD=GoodNewsEveryone
      - LOGOS_LDAP_ATTRS_USERNAME=uid
      - LOGOS_LDAP_ATTRS_EMAIL=mail
      - LOGOS_LDAP_ATTRS_FULLNAME=cn
      - LOGOS_LDAP_ATTRS_PHOTO=jpegPhoto

    networks:
      default:
        aliases:
          - main

  minio:
    image: "minio/minio:RELEASE.2025-04-03T14-56-28Z"
    command: minio server /mnt/data --console-address ":9001"

    volumes:
      - "minio_data:/mnt/data"

    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin

    networks:
      default:
        aliases:
          - minio

  postgres:
    image: postgres:16.8
    command: postgres -c config_file=/etc/postgresql.conf
    restart: always
    stop_signal: SIGINT
    environment:
      - POSTGRES_INITDB_ARGS=--data-checksums
      - POSTGRES_DB=logos
      - POSTGRES_USER=logos
      - POSTGRES_PASSWORD=logos
    volumes:
      - ./files/postgresql.conf:/etc/postgresql.conf:z
      - ./files/postgresql_init.sql:/docker-entrypoint-initdb.d/init.sql:z
      - postgres_data_pg16:/var/lib/postgresql/data
    networks:
      default:
        aliases:
          - postgres

  redis:
    image: valkey/valkey:8.1
    hostname: "logos-devenv-valkey"
    container_name: "logos-devenv-valkey"
    restart: always
    command: valkey-server --save 120 1 --loglevel warning
    volumes:
      - "valkey_data:/data"

    networks:
      default:
        aliases:
          - redis

  mailer:
    image: sj26/mailcatcher:latest
    restart: always
    expose:
      - '1025'
    ports:
      - "127.0.0.1:1080:1080"

    networks:
      default:
        aliases:
          - mailer


  # https://github.com/rroemhild/docker-test-openldap
  ldap:
    image: rroemhild/test-openldap:2.1
    expose:
      - '10389'
      - '10636'
    ports:
      - "127.0.0.1:10389:10389"
      - "127.0.0.1:10636:10636"
    ulimits:
      nofile:
        soft: 1024
        hard: 1024

    networks:
      default:
        aliases:
          - ldap
