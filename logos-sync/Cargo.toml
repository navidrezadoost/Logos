[package]
name = "logos-sync"
version = "0.1.0"
edition = "2021"
description = "Collaboration sync logic for Logos — comments, component change tracking, sessions, prototype state sync, and conflict resolution"

[dependencies]
logos-core = { path = "../logos-core" }
logos-components = { path = "../logos-components" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
log = "0.4.29"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "sync_benchmark"
harness = false
