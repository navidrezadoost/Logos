[package]
name = "logos-agent-analytics"
version = "0.1.0"
edition = "2021"
description = "Agent Analytics Dashboard for Logos — usage metrics, success rates, latency, token usage, and user feedback per agent version"
authors = ["Logos Contributors"]
license = "MPL-2.0"

[dependencies]
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
