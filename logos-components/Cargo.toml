[package]
name = "logos-components"
version = "0.1.0"
edition = "2021"
description = "Component system with variant sets, instances, overrides, and design tokens"

[dependencies]
logos-core = { path = "../logos-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
log = "0.4.29"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "components_benchmark"
harness = false
