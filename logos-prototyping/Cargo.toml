[package]
name = "logos-prototyping"
version = "0.1.0"
edition = "2021"
description = "Prototyping engine: state machines, interaction triggers, smart animate, timeline, preview mode, flow viewer"

[dependencies]
logos-core = { path = "../logos-core" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
log = "0.4.29"
thiserror = "1"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "prototyping_benchmark"
harness = false
