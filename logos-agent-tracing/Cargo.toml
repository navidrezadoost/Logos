[package]
name = "logos-agent-tracing"
version = "0.1.0"
edition = "2021"
description = "Agent Observability & Tracing for Logos — distributed span collection, latency histograms, error rates, and alerting"

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
