[package]
name = "logos-marketplace-db"
version = "0.1.0"
edition = "2021"
description = "Database layer for Logos Marketplace — publisher registry, plugin storage, reviews, analytics"

[dependencies]
logos-core = { path = "../logos-core" }
logos-marketplace-auth = { path = "../logos-marketplace-auth" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "db_benchmark"
harness = false
