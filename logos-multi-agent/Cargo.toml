[package]
name = "logos-multi-agent"
version = "0.1.0"
edition = "2021"
description = "Multi-Agent Collaboration — Senior/Junior agent teams, task decomposition, coordination, and oversight for Logos"

[dependencies]
logos-core      = { path = "../logos-core" }
logos-ai-agent  = { path = "../logos-ai-agent" }
thiserror = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
uuid        = { version = "1", features = ["v4"] }
log         = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "collab_benchmark"
harness = false
