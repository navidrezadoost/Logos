[package]
name = "logos-import-common"
version = "0.1.0"
edition = "2021"
description = "Shared traits, types, and utilities for Logos file format importers"

[dependencies]
logos-core = { path = "../logos-core" }
thiserror = "2.0"
uuid = { version = "1.20", features = ["v4"] }
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
