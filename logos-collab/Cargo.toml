[package]
name = "logos-collab"
version = "0.1.0"
edition = "2021"

[features]
# Enable RocksDB-backed persistent storage.
# Requires libclang/clang (bindgen). Disabled by default so CI
# without native tooling can still compile and run all tests.
persistent-storage = ["dep:rocksdb"]
# Enable the stress-test simulation suite (heavier tokio workloads).
# Run with: cargo test -p logos-collab --features stress
stress = []

[dependencies]
base64 = "0.22.1"
bincode = { version = "2.0.1", features = ["serde"] }
futures-util = "0.3.31"
hmac = "0.12.1"
log = "0.4.29"
logos-identity = { path = "../logos-identity" }
lz4_flex = "0.12.0"
rand = "0.9.1"
rocksdb = { version = "0.24.0", optional = true }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"
tokio = { version = "1.49.0", features = ["full"] }
tokio-tungstenite = { version = "0.28.0", features = ["connect"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }
yrs = "0.25.0"
logos-core = { path = "../logos-core" }

[dev-dependencies]
criterion = "0.8.2"
logos-core = { path = "../logos-core" }
serde_json = "1.0"
tempfile = "3.19.1"

[[bench]]
name = "collab_benchmark"
harness = false
