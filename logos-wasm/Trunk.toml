# Trunk build configuration for logos-wasm
# https://trunkrs.dev/configuration/

[build]
# Output directory (logos-server embeds this at compile time)
dist = "dist"
# Release mode
release = false   # overridden by --release flag on CLI

[watch]
# Files to watch for changes during `trunk watch` / `trunk serve`
ignore = ["dist", "target"]

[serve]
# Dev server address when running `trunk serve`
address = "127.0.0.1"
port    = 8082
open    = false

[tools]
# wasm-opt is disabled via data-wasm-opt="0" in index.html (WasmOptLevel::Off)
# No Binaryen download needed
