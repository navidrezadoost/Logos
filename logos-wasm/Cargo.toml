[package]
name = "logos-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly target for the Logos design engine — full pipeline via WebGPU"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logos-core = { path = "../logos-core" }
logos-render = { path = "../logos-render" }
logos-layout = { path = "../logos-layout" }

wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook = "0.1"
uuid = { version = "1.20.0", features = ["v4", "js"] }
wgpu = { version = "24", features = ["webgpu"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
