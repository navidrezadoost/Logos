[package]
name = "logos-wasm"
version = "0.1.0"
edition = "2021"
description = "WebAssembly target for the Logos design editor — pure Rust, no Java/ClojureScript"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logos-core   = { path = "../logos-core" }
logos-layout = { path = "../logos-layout" }

# WASM bindings
wasm-bindgen         = "0.2"
wasm-bindgen-futures = "0.4"
js-sys               = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "EventTarget",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "PointerEvent",
    "console",
    "Performance",
    "Navigator",
] }
console_error_panic_hook = "0.1"
uuid  = { version = "1.20.0", features = ["v4", "js"] }

# eframe/egui — immediate-mode design editor UI, compiles to WASM natively
# No Java, no ClojureScript, no Node required at runtime.
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "web_screen_reader",
] }

serde = { version = "1", features = ["derive"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"
