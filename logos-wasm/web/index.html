<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logos — WebGPU Design Engine</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #0f0f1a; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
        canvas { width: 100vw; height: 100vh; display: block; cursor: crosshair; }
        canvas.panning { cursor: grab; }

        #hud {
            position: fixed; top: 12px; left: 12px;
            background: rgba(15, 15, 26, 0.85);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px; padding: 10px 14px;
            color: #ccc; font-size: 13px; line-height: 1.6;
            backdrop-filter: blur(8px);
            pointer-events: none;
            min-width: 220px;
        }
        #hud .title { color: #fff; font-weight: 600; font-size: 15px; margin-bottom: 4px; }
        #hud .stat { color: #8b8ba0; }
        #hud .val  { color: #e0e0ff; font-variant-numeric: tabular-nums; }

        #help {
            position: fixed; bottom: 12px; left: 12px;
            background: rgba(15, 15, 26, 0.75);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 8px; padding: 8px 12px;
            color: #666; font-size: 11px; line-height: 1.6;
            pointer-events: none;
        }

        #error {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #1a0000; border: 1px solid #500; border-radius: 12px;
            padding: 24px 32px; color: #f88; font-size: 15px; text-align: center;
            display: none; max-width: 500px;
        }
        #error .msg { color: #faa; margin-top: 8px; font-size: 13px; }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="hud">
        <div class="title">Logos Web Engine</div>
        <div><span class="stat">FPS:</span> <span class="val" id="fps">—</span></div>
        <div><span class="stat">Layers:</span> <span class="val" id="layers">0</span></div>
        <div><span class="stat">Zoom:</span> <span class="val" id="zoom">1.00×</span></div>
        <div><span class="stat">Selected:</span> <span class="val" id="selected">none</span></div>
    </div>

    <div id="help">
        Click: select &nbsp;|&nbsp; Alt+drag / Middle: pan &nbsp;|&nbsp; Scroll: zoom &nbsp;|&nbsp; Esc: deselect
    </div>

    <div id="error">
        <div>⚠ WebGPU Not Available</div>
        <div class="msg" id="error-msg"></div>
    </div>

    <script type="module">
        // ── Load WASM module ──────────────────────────────────────
        import init, { LogosApp } from './pkg/logos_wasm.js';

        const $ = id => document.getElementById(id);

        async function main() {
            // Check WebGPU support
            if (!navigator.gpu) {
                $('error').style.display = 'block';
                $('error-msg').textContent =
                    'Your browser does not support WebGPU. Try Chrome 113+, Edge 113+, or Firefox Nightly.';
                return;
            }

            await init();

            // ── Canvas setup ──────────────────────────────────────
            const canvas = $('canvas');
            const dpr = window.devicePixelRatio || 1;
            canvas.width  = Math.floor(window.innerWidth  * dpr);
            canvas.height = Math.floor(window.innerHeight * dpr);

            // ── Initialize Logos engine ───────────────────────────
            const app = await LogosApp.create(canvas);
            app.set_clear_color(0.06, 0.06, 0.10, 1.0);
            app.load_demo_scene(100);

            // ── Input state ───────────────────────────────────────
            let isPanning = false;
            let lastX = 0, lastY = 0;

            canvas.addEventListener('mousedown', e => {
                if (e.button === 1 || (e.button === 0 && e.altKey)) {
                    // Middle-click or Alt+click → pan
                    isPanning = true;
                    lastX = e.clientX;
                    lastY = e.clientY;
                    canvas.classList.add('panning');
                    e.preventDefault();
                } else if (e.button === 0) {
                    // Left-click → select
                    const sel = app.select_at(
                        e.offsetX * dpr,
                        e.offsetY * dpr
                    );
                    $('selected').textContent = sel
                        ? sel.substring(0, 8) + '…'
                        : 'none';
                }
            });

            canvas.addEventListener('mousemove', e => {
                if (isPanning) {
                    const dx = e.clientX - lastX;
                    const dy = e.clientY - lastY;
                    app.pan(dx * dpr, dy * dpr);
                    lastX = e.clientX;
                    lastY = e.clientY;
                }
            });

            window.addEventListener('mouseup', () => {
                isPanning = false;
                canvas.classList.remove('panning');
            });

            canvas.addEventListener('wheel', e => {
                e.preventDefault();
                const factor = e.deltaY > 0 ? 0.92 : 1.0 / 0.92;
                app.zoom_at(
                    e.offsetX * dpr,
                    e.offsetY * dpr,
                    factor
                );
            }, { passive: false });

            window.addEventListener('keydown', e => {
                if (e.key === 'Escape') {
                    app.clear_selection();
                    $('selected').textContent = 'none';
                }
            });

            // ── Resize handler ────────────────────────────────────
            const ro = new ResizeObserver(() => {
                canvas.width  = Math.floor(window.innerWidth  * dpr);
                canvas.height = Math.floor(window.innerHeight * dpr);
                app.resize(canvas.width, canvas.height);
            });
            ro.observe(document.body);

            // ── Render loop ───────────────────────────────────────
            let frameCount = 0;
            let lastTime = performance.now();

            function frame() {
                try {
                    app.render_frame();
                } catch (e) {
                    console.error('Logos render error:', e);
                }
                frameCount++;

                const now = performance.now();
                if (now - lastTime >= 1000) {
                    const fps = Math.round(frameCount * 1000 / (now - lastTime));
                    $('fps').textContent     = fps;
                    $('layers').textContent  = app.layer_count();
                    $('zoom').textContent    = app.zoom().toFixed(2) + '×';
                    frameCount = 0;
                    lastTime = now;
                }

                requestAnimationFrame(frame);
            }

            requestAnimationFrame(frame);
            console.log('Logos web engine started');
        }

        main().catch(e => {
            console.error('Logos init error:', e);
            $('error').style.display = 'block';
            $('error-msg').textContent = String(e);
        });
    </script>
</body>
</html>
