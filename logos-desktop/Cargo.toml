[package]
name = "logos-desktop"
version = "0.1.0"
edition = "2021"

[dependencies]
logos-core = { version = "0.1.0", path = "../logos-core" }
logos-collab = { version = "0.1.0", path = "../logos-collab" }
logos-layout = { version = "0.1.0", path = "../logos-layout" }
logos-render = { version = "0.1.0", path = "../logos-render" }
logos-text = { version = "0.1.0", path = "../logos-text" }
logos-marketplace-auth = { version = "0.1.0", path = "../logos-marketplace-auth" }
logos-marketplace-db = { version = "0.1.0", path = "../logos-marketplace-db" }
logos-marketplace-api = { version = "0.1.0", path = "../logos-marketplace-api" }
winit = "0.30"
wgpu = "24"
pollster = "0.4"
log = "0.4"
env_logger = "0.11"
uuid = { version = "1.20.0", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lz4_flex = "0.11"
dirs = "6"
tempfile = { version = "3", optional = true }

[dev-dependencies]
tempfile = "3"
