[package]
name = "logos-desktop"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "logos-desktop"
path = "src/main.rs"
required-features = ["desktop-ui"]

[lib]
name = "logos_desktop"
path = "src/lib.rs"

[features]
default = ["desktop-ui"]
# Full native desktop (GTK/wgpu/winit). Excluded from lib/tests to avoid GTK deps.
desktop-ui = [
    "dep:winit",
    "dep:wgpu",
    "dep:pollster",
    "dep:env_logger",
    "dep:logos-render",
    "dep:logos-text",
    "dep:logos-collab",
    "dep:logos-marketplace-auth",
    "dep:logos-marketplace-db",
    "dep:logos-marketplace-api",
    "dep:muda",
    "dep:rfd",
    "dep:tray-icon",
]

[dependencies]
# Always-available (pure data, no GTK)
logos-core  = { version = "0.1.0", path = "../logos-core" }
logos-layout = { version = "0.1.0", path = "../logos-layout" }
logos-prototyping = { version = "0.1.0", path = "../logos-prototyping" }
log         = "0.4"
uuid        = { version = "1.20.0", features = ["v4"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
lz4_flex    = "0.11"
dirs        = "6"
tempfile    = { version = "3", optional = true }

# desktop-ui feature deps (optional)
logos-collab           = { version = "0.1.0", path = "../logos-collab",           optional = true }
logos-render           = { version = "0.1.0", path = "../logos-render",           optional = true }
logos-text             = { version = "0.1.0", path = "../logos-text",             optional = true }
logos-marketplace-auth = { version = "0.1.0", path = "../logos-marketplace-auth", optional = true }
logos-marketplace-db   = { version = "0.1.0", path = "../logos-marketplace-db",   optional = true }
logos-marketplace-api  = { version = "0.1.0", path = "../logos-marketplace-api",  optional = true }
winit       = { version = "0.30",  optional = true }
wgpu        = { version = "24",    optional = true }
pollster    = { version = "0.4",   optional = true }
env_logger  = { version = "0.11",  optional = true }
muda        = { version = "0.17",  optional = true, default-features = false, features = ["gtk"] }
rfd         = { version = "0.17",  optional = true }
tray-icon   = { version = "0.21",  optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"

