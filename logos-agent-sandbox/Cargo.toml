[package]
name = "logos-agent-sandbox"
version = "0.1.0"
edition = "2021"
description = "Agent Testing Sandbox for Logos — isolated pre-publish testing, interaction simulation, performance profiling, and certification"
authors = ["Logos Contributors"]
license = "MPL-2.0"

[dependencies]
logos-core      = { path = "../logos-core" }
logos-ai-agent  = { path = "../logos-ai-agent" }
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
