[package]
name = "logos-replay"
version = "0.1.0"
edition = "2021"
description = "Deterministic operation log, replay engine, snapshots, and time-travel for Logos"

[dependencies]
logos-identity = { path = "../logos-identity" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "replay_benchmark"
harness = false
