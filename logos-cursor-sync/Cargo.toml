[package]
name = "logos-cursor-sync"
version = "0.1.0"
edition = "2021"
description = "Live cursor sync for real-time collaboration — page-aware filtering, editing indicators, idle fade-out, viewport culling, presence snapshots, and cursor trail history"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
uuid = { version = "1.20.0", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "cursor_benchmark"
harness = false
