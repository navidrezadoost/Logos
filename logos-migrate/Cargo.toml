[package]
name        = "logos-migrate"
version     = "0.1.0"
edition     = "2021"
description = "Cross-platform design file migration wizard for Logos"

[lib]
name = "logos_migrate"
path = "src/lib.rs"

[dependencies]
logos-core           = { version = "0.1.0", path = "../logos-core" }
logos-import-common  = { version = "0.1.0", path = "../logos-import-common" }
logos-import-xd      = { version = "0.1.0", path = "../logos-import-xd" }
logos-import-sketch  = { version = "0.1.0", path = "../logos-import-sketch" }
logos-import-figma   = { version = "0.1.0", path = "../logos-import-figma" }
serde                = { version = "1", features = ["derive"] }
serde_json           = "1"
uuid                 = { version = "1.20.0", features = ["v4"] }
log                  = "0.4"
walkdir              = "2"

[dev-dependencies]
logos-core           = { version = "0.1.0", path = "../logos-core" }
logos-import-xd      = { version = "0.1.0", path = "../logos-import-xd" }
logos-import-sketch  = { version = "0.1.0", path = "../logos-import-sketch" }
logos-import-figma   = { version = "0.1.0", path = "../logos-import-figma" }
tempfile = "3"
