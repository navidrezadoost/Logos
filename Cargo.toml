[workspace]
members = [
    "logos-core",
    "logos-render",
    "logos-text",
    "logos-desktop",
    "logos-wasm",
    "logos-layout",
    "logos-collab",
    "logos-plugins",
    "logos-ai",
    "logos-import-figma",
    "logos-import-common",
    "logos-import-svg",
    "logos-import-sketch",
    "logos-import-pdf",
    "logos-import-xd",
    "logos-import-canva",
    "logos-marketplace-auth",
    "logos-marketplace-db",
    "logos-marketplace-api",
    "logos-export",
    "logos-prototyping",
    "logos-components",
    "logos-sync",
    "logos-perf",
    "logos-section",
    "logos-cursor-sync",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
