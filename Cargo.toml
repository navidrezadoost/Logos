[workspace]
members = [
    "logos-core",
    "logos-render",
    "logos-text",
    "logos-desktop",
    "logos-wasm",
    "logos-layout",
    "logos-collab",
    "logos-plugins",
    "logos-ai",
    "logos-import-figma",
    "logos-import-common",
    "logos-import-svg",
    "logos-import-sketch",
    "logos-import-pdf",
    "logos-import-xd",
    "logos-import-canva",
]
resolver = "2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
