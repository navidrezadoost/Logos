[workspace]
members = [
    "logos-core",
    "logos-render",
    "logos-text",
    "logos-desktop",
    "logos-wasm",
    "logos-layout",
    "logos-collab",
    "logos-plugins",
    "logos-ai",
    "logos-import-figma",
    "logos-import-common",
    "logos-import-svg",
    "logos-import-sketch",
    "logos-import-pdf",
    "logos-import-xd",
    "logos-import-canva",
    "logos-marketplace-auth",
    "logos-marketplace-db",
    "logos-marketplace-api",
    "logos-export",
    "logos-prototyping",
    "logos-components",
    "logos-sync",
    "logos-perf",
    "logos-section",
    "logos-cursor-sync",
    "logos-comments",
    "logos-spreadsheet",
    "logos-identity",
    "logos-replay",
    "logos-history",
    "logos-multiplayer",
    "logos-ai-agent",
    "logos-agent-ui",
    "logos-rl-ux",
    "logos-agent-marketplace",
    "logos-multi-agent",
    "logos-prompt-engine",
    "logos-agent-sandbox",
    "logos-agent-versioning",
    "logos-agent-analytics",
