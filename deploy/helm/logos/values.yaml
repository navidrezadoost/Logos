global:
  imagePullSecrets: []
  imagePullPolicy: IfNotPresent
  publicUri: http://localhost:9001
  secretKey: change-this-insecure-key
  telemetryEnabled: true

frontend:
  enabled: true
  replicaCount: 2
  image:
    repository: penpotapp/frontend
    tag: latest
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  probes:
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70

backend:
  enabled: true
  replicaCount: 2
  image:
    repository: penpotapp/backend
    tag: latest
  service:
    type: ClusterIP
    port: 6060
  resources: {}
  probes:
    path: /api/healthz
    initialDelaySeconds: 20
    periodSeconds: 10
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  smtp:
    from: no-reply@example.com
    replyTo: no-reply@example.com
    host: logos-mailcatch
    port: 1025
    username: ""
    password: ""
    tls: false
    ssl: false

exporter:
  enabled: true
  replicaCount: 1
  image:
    repository: penpotapp/exporter
    tag: latest
  service:
    type: ClusterIP
    port: 6061
  resources: {}
  probes:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10

mcp:
  enabled: true
  replicaCount: 1
  image:
    repository: penpotapp/mcp
    tag: latest
  service:
    type: ClusterIP
    port: 8080
  resources: {}
  probes:
    path: /
    initialDelaySeconds: 15
    periodSeconds: 10

postgres:
  enabled: true
  image:
    repository: postgres
    tag: "15"
  service:
    port: 5432
  persistence:
    enabled: true
    size: 20Gi
  auth:
    database: penpot
    username: penpot
    password: penpot
  resources: {}

valkey:
  enabled: true
  image:
    repository: valkey/valkey
    tag: "8.1"
  service:
    port: 6379
  resources: {}

mailcatch:
  enabled: true
  image:
    repository: sj26/mailcatcher
    tag: latest
  service:
    smtpPort: 1025
    httpPort: 1080

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: logos.local
      paths:
        - path: /
          pathType: Prefix
  tls: []
