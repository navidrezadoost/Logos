{{- if .Values.valkey.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "logos.fullname" . }}-valkey
  labels:
    {{- include "logos.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "logos.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        {{- include "logos.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.valkey.image.repository }}:{{ .Values.valkey.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - containerPort: 6379
              name: redis
          env:
            - name: VALKEY_EXTRA_FLAGS
              value: --maxmemory 128mb --maxmemory-policy volatile-lfu
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli ping | grep PONG"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            {{- toYaml .Values.valkey.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logos.fullname" . }}-valkey
  labels:
    {{- include "logos.labels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
spec:
  selector:
    {{- include "logos.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: valkey
  ports:
    - name: redis
      port: {{ .Values.valkey.service.port }}
      targetPort: redis
{{- end }}
