[package]
name = "logos-prompt-engine"
version = "0.1.0"
edition = "2021"
description = "Advanced prompt engineering for Logos AI agents — few-shot examples, chain-of-thought reasoning, iterative refinement and self-critique"
authors = ["Logos Contributors"]
license = "MPL-2.0"

[dependencies]
logos-core      = { path = "../logos-core" }
logos-ai-agent  = { path = "../logos-ai-agent" }
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "prompt_benchmark"
harness = false
