[package]
name        = "logos-layout-wasm"
version     = "0.1.0"
edition     = "2021"
description = "WASM bridge for logos-layout — JSON-in/JSON-out layout engine"
license-file = "../../LICENSE"
repository  = "https://github.com/navidrezadoost/Logos"

# cdylib = WASM binary / native shared lib for testing
# rlib   = for unit tests on native target
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logos-layout = { path = "../logos-layout" }
serde        = { version = "1.0", features = ["derive"] }
serde_json   = "1.0"
