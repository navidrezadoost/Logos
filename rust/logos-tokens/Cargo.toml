[package]
name        = "logos-tokens"
version     = "0.1.0"
edition     = "2021"
description = "Semantic token resolution engine for Logos"
license-file = "../../LICENSE"
repository  = "https://github.com/navidrezadoost/Logos"

[lib]
crate-type = ["rlib"]

[dependencies]
logos-types = { path = "../logos-types" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
uuid = { version = "1", features = ["serde"] }

[dev-dependencies]
uuid = { version = "1", features = ["v4", "serde"] }
