[package]
name        = "logos-vector-wasm"
version     = "0.1.0"
edition     = "2021"
description = "WASM bridge for logos-vector + logos-vector-ops — JSON-in/JSON-out C-ABI"
license     = "MPL-2.0"
repository  = "https://github.com/navidrezadoost/Logos"

# cdylib = WASM binary / native shared lib
# rlib   = for unit tests on native target
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
logos-vector     = { path = "../logos-vector" }
logos-vector-ops = { path = "../logos-vector-ops" }
serde            = { version = "1.0", features = ["derive"] }
serde_json       = "1.0"
