[package]
name = "logos-history"
version = "0.1.0"
edition = "2021"
description = "Version history data layer for Logos — timeline, bookmarks, branches, and restore"

[dependencies]
logos-identity = { path = "../logos-identity" }
logos-replay = { path = "../logos-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
criterion = "0.5"
