name: Design token contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'contracts/design-token/v0.1/**'
      - 'test/design-token-contract/**'
      - 'docs/architecture/DT-C1-EXECUTABLE-TOKEN-CONTRACT.md'
      - 'rust/logos-tokens/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/design-token-contract.yml'
  push:
    branches: [main]
    paths:
      - 'contracts/design-token/v0.1/**'
      - 'test/design-token-contract/**'
      - 'docs/architecture/DT-C1-EXECUTABLE-TOKEN-CONTRACT.md'
      - 'rust/logos-tokens/**'
      - 'rust/Cargo.toml'
      - 'rust/Cargo.lock'
      - '.github/workflows/design-token-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    name: Proposed contract fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: test/design-token-contract/package-lock.json
      - run: npm ci --prefix test/design-token-contract
      - run: npm test --prefix test/design-token-contract
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path rust/Cargo.toml -p logos-tokens --locked
