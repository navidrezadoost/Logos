name: Rust workspaces

on:
  push:
    branches: ["main", "r1/**"]
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "render-wasm/**"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test actual Rust workspaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install renderer system dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            rust -> rust/target

      - name: Test root workspace (render-wasm)
        run: cargo test --workspace --locked

      - name: Test Rust domain workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

      - name: Check renderer WASM target
        run: cargo check --manifest-path render-wasm/Cargo.toml --target wasm32-unknown-unknown --locked
