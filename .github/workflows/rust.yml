name: Rust workspaces

on:
  push:
    branches: ["main", "r1/**"]
  pull_request:
    branches: ["main"]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust/**"
      - "render-wasm/**"
      - "docs/r1/P0.4-CI-RUNNER-APT-DNS-FIX.md"
      - "logos-app/src/components/canvas/**"
      - "logos-app/src/render-wasm/**"
      - "logos-app/src/stores/**"
      - "logos-app/src/test-support/**"
      - "logos-app/src/document-core/**"
      - "logos-app/g1-b3-adapter-smoke.html"
      - "logos-app/vite.g1-b3-adapter-smoke.config.ts"
      - "test/benchmarks/g1-b3-adapter-browser.mjs"
      - "logos-app/test-harness/**"
      - "logos-app/vite.renderer-smoke.config.ts"
      - "test/fixtures/p0-document-compat/**"
      - "docs/r1/P0.4-REACT-RUNTIME-VERTICAL-SLICE.md"
      - ".github/workflows/rust.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test actual Rust workspaces
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Diagnose runner and verify official Ubuntu repository access
        shell: bash
        run: |
          set -euo pipefail
          cat /etc/os-release
          echo 'APT source URI/suite configuration:'
          grep -hE '^(URIs|Suites|Components|Signed-By):' /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          if [[ -f /etc/apt/apt-mirrors.txt ]]; then
            echo 'Runner apt mirror list:'
            cat /etc/apt/apt-mirrors.txt
          fi

          for host in archive.ubuntu.com security.ubuntu.com; do
            echo "DNS records for $host:"
            getent ahostsv4 "$host"
          done

          for url in \
            https://archive.ubuntu.com/ubuntu/dists/noble/InRelease \
            https://archive.ubuntu.com/ubuntu/dists/noble-updates/InRelease \
            https://security.ubuntu.com/ubuntu/dists/noble-security/InRelease; do
            echo "Probing official repository metadata: $url"
            curl --fail --silent --show-error --location --max-time 30 "$url" -o /dev/null
          done

      - name: Install renderer system dependencies from official Ubuntu repositories
        shell: bash
        run: |
          set -euo pipefail
          apt_tmp="$(mktemp -d /tmp/logos-p04-apt.XXXXXX)"
          trap 'sudo rm -rf "$apt_tmp"' EXIT
          chmod 0755 "$apt_tmp"
          apt_sources="$apt_tmp/ubuntu.sources"
          cat >"$apt_sources" <<'APT'
          Types: deb
          URIs: https://archive.ubuntu.com/ubuntu
          Suites: noble noble-updates noble-backports
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg

          Types: deb
          URIs: https://security.ubuntu.com/ubuntu
          Suites: noble-security
          Components: main restricted universe multiverse
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          APT

          apt_lists="$apt_tmp/lists"
          mkdir -p "$apt_lists/partial"
          chmod 0755 "$apt_lists"
          sudo chown _apt:root "$apt_lists/partial"
          sudo chmod 0700 "$apt_lists/partial"
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_sources"
            -o 'Dir::Etc::sourceparts=-'
            -o "Dir::State::lists=$apt_lists"
            -o 'APT::Get::List-Cleanup=1'
          )
          sudo apt-get "${apt_options[@]}" update
          sudo apt-get "${apt_options[@]}" install -y libclang-dev libfontconfig1-dev
          dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' libclang-dev libfontconfig1-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.93.0
          targets: wasm32-unknown-emscripten,wasm32-unknown-unknown
          components: rustfmt

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            rust -> rust/target

      - name: Capture HarfBuzz and Skia link diagnostics
        shell: bash
        run: |
          set -euo pipefail

          printf 'SKIA_USE_SYSTEM_LIBRARIES=%s\n' "${SKIA_USE_SYSTEM_LIBRARIES:-<unset>}"
          printf 'SKIA_SOURCE_DIR=%s\n' "${SKIA_SOURCE_DIR:-<unset>}"
          printf 'SKIA_LIBRARY_SEARCH_PATH=%s\n' "${SKIA_LIBRARY_SEARCH_PATH:-<unset>}"
          if [[ -n "${SKIA_BINARIES_URL:-}" ]]; then
            echo 'SKIA_BINARIES_URL=<set; value redacted>'
          else
            echo 'SKIA_BINARIES_URL=<unset; crate default applies>'
          fi

          for package in libharfbuzz-dev libharfbuzz0b; do
            dpkg-query -W -f='${binary:Package}\t${Version}\t${db:Status-Status}\n' "$package" 2>/dev/null || echo "$package: not installed"
          done
          pkg-config --modversion harfbuzz || echo 'pkg-config harfbuzz: unavailable'
          pkg-config --libs harfbuzz || echo 'pkg-config harfbuzz libs: unavailable'
          ldconfig -p | grep -E 'libharfbuzz(\.so|\.so\.)' || echo 'ldconfig: no HarfBuzz library entry'

          if [[ -d target/debug/build ]]; then
            while IFS= read -r file; do
              case "$file" in
                */output)
                  echo "Skia build-script directives: $file"
                  grep -E '^cargo:rustc-link-(lib|search)=|^cargo:rerun-if-env-changed=SKIA_USE_SYSTEM_LIBRARIES' "$file" || true
                  ;;
                */key.txt|*/tag.txt)
                  printf '%s=' "$file"
                  cat "$file"
                  ;;
              esac
            done < <(find target/debug/build -type f \
              \( -path '*/skia-bindings-*/output' \
              -o -path '*/skia-bindings-*/out/skia/key.txt' \
              -o -path '*/skia-bindings-*/out/skia/tag.txt' \) -print | sort)

            args_gn=$(find target/debug/build -type f -path '*/skia-bindings-*/out/skia/args.gn' -print -quit)
            if [[ -n "$args_gn" ]]; then
              echo "Skia GN HarfBuzz flags: $args_gn"
              grep -E 'skia_use_(system_)?harfbuzz|skia_enable_skparagraph|skia_use_system_icu' "$args_gn" || true
            else
              echo 'No args.gn present in restored Skia output'
            fi

            echo 'Cached Skia static libraries:'
            find target/debug/build -type f -path '*/skia-bindings-*/out/skia/lib*.a' \
              -printf '%p %s bytes\n' | sort
            find target/debug/build -type f -path '*/skia-bindings-*/out/skia/lib*.a' \
              -print0 | xargs -0 -r sha256sum
          else
            echo 'No restored target/debug/build directory'
          fi

      - name: Test root workspace (render-wasm)
        # Same locked test; -vv retains build-script directives and the final linker command.
        run: cargo test --workspace --locked -vv

      - name: Test Rust domain workspace
        run: cargo test --manifest-path rust/Cargo.toml --workspace --locked

      - name: Install Node.js for candidate document WASM tests
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Install wasm-pack for candidate document parity tests
        uses: jetli/wasm-pack-action@v0.4.0
        with:
          version: v0.13.1

      - name: Run candidate document contract tests under Node WebAssembly
        shell: bash
        run: |
          set -euo pipefail
          wasm-pack test --node rust/logos-types --features wasm \
            2>&1 | tee "${RUNNER_TEMP}/g1-b2-wasm-conformance.log"
          grep -E 'running [1-9][0-9]* tests?' \
            "${RUNNER_TEMP}/g1-b2-wasm-conformance.log"

      - name: Check out exact PR head for benchmark provenance
        run: |
          head_sha="${{ github.event.pull_request.head.sha || github.sha }}"
          git fetch --no-tags origin "$head_sha"
          git checkout --detach "$head_sha"

      - name: Run locked candidate-core benchmark with provenance
        run: |
          rust/logos-types/scripts/run_document_core_bench.sh \
            | tee "${RUNNER_TEMP}/g1-b2-document-core-benchmark.jsonl"

      - name: Upload candidate-core benchmark raw results
        uses: actions/upload-artifact@v4
        with:
          name: g1-b2-document-core-benchmark-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/g1-b2-document-core-benchmark.jsonl
          if-no-files-found: error

      - name: Install Emscripten SDK
        shell: bash
        run: |
          set -euo pipefail
          emsdk_dir="${RUNNER_TEMP}/emsdk"
          git clone --depth 1 --branch 4.0.6 https://github.com/emscripten-core/emsdk.git "$emsdk_dir"
          test "$(git -C "$emsdk_dir" rev-parse HEAD)" = "24fc909c0da13ef641d5ae75e89b5a97f25e37aa"
          "$emsdk_dir/emsdk" install 4.0.6
          "$emsdk_dir/emsdk" activate 4.0.6
          echo "EMSDK=$emsdk_dir" >> "$GITHUB_ENV"

      - name: Build renderer WASM with Emscripten
        run: NODE_ENV=production ./render-wasm/build

      - name: Verify renderer artifacts and browser initialization
        working-directory: logos-app
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          assets = Path("dist/js")
          js = assets / "render-wasm.js"
          wasm = assets / "render-wasm.wasm"
          worker = assets / "worker/render.js"
          shared = assets / "shared.js"
          for asset in (js, wasm, worker, shared):
              if not asset.is_file() or asset.stat().st_size == 0:
                  raise SystemExit(f"Missing or empty renderer asset: {asset}")
          if not wasm.read_bytes().startswith(b"\0asm"):
              raise SystemExit(f"Invalid WebAssembly magic: {wasm}")
          if "render-wasm.wasm?version=" not in js.read_text(encoding="utf-8"):
              raise SystemExit(f"Renderer loader does not reference the packaged WASM URL: {js}")
          if "export const " not in shared.read_text(encoding="utf-8"):
              raise SystemExit(f"Shared module does not contain generated exports: {shared}")
          PY

          cat > dist/renderer-smoke.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Logos renderer smoke test</title>
          <canvas id="canvas" width="320" height="240"></canvas>
          <pre id="status" data-status="pending">pending</pre>
          <script type="module">
          const status = document.getElementById("status");
          let stage = "not-started";
          let lastPassedStage = "none";
          let gl = null;
          let targetFramebuffer = null;
          const state = {
            jsFetched: false,
            wasmFetched: false,
            factoryImported: false,
            moduleInitialized: false,
            contextRegistered: false,
            contextCurrent: false,
            rendererInitialized: false,
            shapeSubmitted: false,
            rootCreated: false,
            shapeParented: false,
            rootChildrenSet: false,
            expectedPixel: [0, 0, 255, 255],
            renderCompleted: false,
            webglVersion: null,
            webglRenderer: null,
            drawingBufferSize: null,
            targetFramebuffer: null,
            initialFramebufferBindings: null,
            framebufferAfterInit: null,
            framebufferAfterRender: null,
            framebufferStatus: null,
            initialViewport: null,
            viewportAfterInit: null,
            viewportAfterRender: null,
            viewportAtReadback: null,
            readBuffer: null,
            contextLostAfterRender: null,
            glErrorsAfterContext: [],
            glErrorsAfterInit: [],
            glErrorsAfterRender: [],
            glErrorsAfterRead: [],
            locateFile: "/js/render-wasm.wasm",
            moduleExports: null,
            wasmMemoryBytes: null,
            pixel: null,
          };
          const browserErrors = [];
          window.addEventListener("error", (event) => browserErrors.push(event.error?.stack ?? event.message));
          window.addEventListener("unhandledrejection", (event) => browserErrors.push(event.reason?.stack ?? String(event.reason)));
          const originalConsoleError = console.error.bind(console);
          console.error = (...args) => {
            browserErrors.push(args.map((arg) => arg?.stack ?? String(arg)).join(" "));
            originalConsoleError(...args);
          };

          async function checkpoint(name, operation) {
            stage = name;
            console.log(`[renderer-smoke] START ${name}`);
            const result = await operation();
            lastPassedStage = name;
            console.log(`[renderer-smoke] PASS ${name}`);
            return result;
          }

          function framebufferName(framebuffer) {
            return framebuffer === null ? "default" : "non-default";
          }

          function framebufferBindings(context) {
            return {
              framebuffer: framebufferName(context.getParameter(context.FRAMEBUFFER_BINDING)),
              draw: framebufferName(context.getParameter(context.DRAW_FRAMEBUFFER_BINDING)),
              read: framebufferName(context.getParameter(context.READ_FRAMEBUFFER_BINDING)),
            };
          }

          function drainGlErrors(context) {
            const errors = [];
            for (let i = 0; i < 16; i += 1) {
              const error = context.getError();
              if (error === context.NO_ERROR) break;
              errors.push(`0x${error.toString(16)}`);
            }
            return errors;
          }

          try {
            const source = await checkpoint("fetch renderer JavaScript", async () => {
              const response = await fetch("/js/render-wasm.js");
              if (!response.ok) throw new Error(`JavaScript URL returned ${response.status}`);
              state.jsFetched = true;
              return response.text();
            });
            await checkpoint("fetch renderer WebAssembly", async () => {
              const response = await fetch("/js/render-wasm.wasm");
              if (!response.ok) throw new Error(`WASM URL returned ${response.status}`);
              const bytes = new Uint8Array(await response.arrayBuffer());
              if (bytes[0] !== 0 || bytes[1] !== 0x61 || bytes[2] !== 0x73 || bytes[3] !== 0x6d) {
                throw new Error("WASM URL did not return a valid WebAssembly module");
              }
              state.wasmFetched = true;
              return bytes.length;
            });
            const factory = await checkpoint("import Emscripten JavaScript module", async () => {
              // Match logos-app/src/render-wasm/module.ts: import fetched glue from a Blob URL.
              const blobUrl = URL.createObjectURL(new Blob([source], { type: "text/javascript" }));
              try {
                const imported = await import(blobUrl);
                if (typeof imported.default !== "function") {
                  throw new Error("Emscripten factory export missing");
                }
                state.factoryImported = true;
                return imported.default;
              } finally {
                URL.revokeObjectURL(blobUrl);
              }
            });

            const module = await checkpoint("invoke Emscripten module factory", async () => {
              const loaded = await factory({ locateFile: () => state.locateFile });
              state.moduleInitialized = true;
              state.wasmMemoryBytes = loaded.HEAPU8?.byteLength ?? null;
              return loaded;
            });
            await checkpoint("validate renderer exports", async () => {
              const required = [
                "GL", "HEAPU8", "_init", "_set_render_options", "_set_browser",
                "_init_shapes_pool", "_use_shape", "_set_shape_type", "_set_shape_selrect",
                "_set_shape_rotation", "_set_shape_transform", "_set_shape_clip_content",
                "_set_parent", "_set_children_1", "_alloc_bytes", "_set_shape_fills",
                "_free_bytes", "_render_sync",
              ];
              state.moduleExports = Object.fromEntries(required.map((name) => [name, typeof module[name]]));
              const missing = required.filter((name) => !(name in module));
              if (missing.length) throw new Error(`missing renderer exports: ${missing.join(", ")}`);
            });
            const canvas = document.getElementById("canvas");
            gl = await checkpoint("acquire WebGL2 context", async () => {
              const context = canvas.getContext("webgl2", { alpha: true, preserveDrawingBuffer: true });
              if (!context) throw new Error("WebGL2 context unavailable");
              state.webglVersion = context.getParameter(context.VERSION);
              state.webglRenderer = context.getParameter(context.RENDERER);
              state.drawingBufferSize = [context.drawingBufferWidth, context.drawingBufferHeight];
              state.contextLost = context.isContextLost();
              return context;
            });
            const contextHandle = await checkpoint("register WebGL context", async () => {
              const handle = module.GL.registerContext(gl, { majorVersion: 2 });
              state.contextRegistered = true;
              return handle;
            });
            await checkpoint("make WebGL context current", async () => {
              module.GL.makeContextCurrent(contextHandle);
              state.contextCurrent = true;
              targetFramebuffer = gl.getParameter(gl.FRAMEBUFFER_BINDING);
              state.targetFramebuffer = framebufferName(targetFramebuffer);
              state.initialFramebufferBindings = framebufferBindings(gl);
              state.initialViewport = Array.from(gl.getParameter(gl.VIEWPORT));
              state.glErrorsAfterContext = drainGlErrors(gl);
            });
            await checkpoint("initialize renderer", async () => {
              module._init(canvas.width, canvas.height);
              state.rendererInitialized = true;
              state.framebufferAfterInit = framebufferBindings(gl);
              state.viewportAfterInit = Array.from(gl.getParameter(gl.VIEWPORT));
              state.glErrorsAfterInit = drainGlErrors(gl);
            });
            await checkpoint("configure renderer", async () => {
              module._set_render_options(0, 1);
              module._set_browser(0);
            });
            await checkpoint("initialize shape pool", async () => {
              module._init_shapes_pool(2);
            });
            await checkpoint("create nil-UUID scene root", async () => {
              // render_sync() traverses the nil-UUID root and its explicit children list.
              module._use_shape(0, 0, 0, 0);
              state.rootCreated = true;
            });
            await checkpoint("configure rectangle", async () => {
              module._use_shape(0, 0, 0, 1);
              module._set_shape_type(3);
              module._set_shape_selrect(50, 50, 250, 150);
              module._set_shape_rotation(0);
              module._set_shape_transform(1, 0, 0, 1, 0, 0);
              module._set_shape_clip_content(false);
              module._set_parent(0, 0, 0, 0);
              state.shapeParented = true;
            });
            await checkpoint("allocate and populate fill buffer", async () => {
              // The 4-byte ABI header is followed by Rust's 160-byte RawFillData enum.
              const fillRecordBytes = 160;
              const totalBytes = 4 + fillRecordBytes;
              const ptr = module._alloc_bytes(totalBytes);
              module.HEAPU8.fill(0, ptr, ptr + totalBytes);
              module.HEAPU8[ptr] = 1;
              module.HEAPU8[ptr + 4] = 0; // RawFillData::Solid
              new DataView(module.HEAPU8.buffer, ptr + 8, 4).setUint32(0, 0xff0000ff, true);
              state.fillBuffer = { ptr, bytes: totalBytes, rawRecordBytes: fillRecordBytes };
            });
            await checkpoint("submit rectangle fill", async () => {
              module._set_shape_fills();
              module._free_bytes();
              state.shapeSubmitted = true;
            });
            await checkpoint("attach rectangle to scene root", async () => {
              module._use_shape(0, 0, 0, 0);
              module._set_children_1(0, 0, 0, 1);
              state.rootChildrenSet = true;
            });
            await checkpoint("render rectangle", async () => {
              module._render_sync();
              gl.finish();
              state.renderCompleted = true;
              state.framebufferAfterRender = framebufferBindings(gl);
              state.viewportAfterRender = Array.from(gl.getParameter(gl.VIEWPORT));
              state.contextLostAfterRender = gl.isContextLost();
              state.glErrorsAfterRender = drainGlErrors(gl);
            });
            await checkpoint("read rendered pixel", async () => {
              // Skia's Target surface wraps the framebuffer active when Rust
              // initializes GpuState. Restore that target before readback.
              gl.bindFramebuffer(gl.FRAMEBUFFER, targetFramebuffer);
              if (targetFramebuffer === null) gl.readBuffer(gl.BACK);
              state.readbackFramebuffer = framebufferName(gl.getParameter(gl.READ_FRAMEBUFFER_BINDING));
              state.framebufferStatus = `0x${gl.checkFramebufferStatus(gl.FRAMEBUFFER).toString(16)}`;
              state.readBuffer = `0x${gl.getParameter(gl.READ_BUFFER).toString(16)}`;
              state.viewportAtReadback = Array.from(gl.getParameter(gl.VIEWPORT));
              if (state.framebufferStatus !== `0x${gl.FRAMEBUFFER_COMPLETE.toString(16)}`) {
                throw new Error(`incomplete renderer framebuffer: ${state.framebufferStatus}`);
              }
              const points = [
                { x: 100, y: 120, inside: true },
                { x: 160, y: 120, inside: true },
                { x: 200, y: 120, inside: true },
                { x: 100, y: 70, inside: true },
                { x: 200, y: 70, inside: true },
                { x: 10, y: 10, inside: false },
              ];
              state.pixels = points.map(({ x, y, inside }) => {
                const pixel = new Uint8Array(4);
                gl.readPixels(x, y, 1, 1, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
                return { x, y, inside, rgba: Array.from(pixel) };
              });
              state.glErrorsAfterRead = drainGlErrors(gl);
              const interiorPixels = state.pixels.filter(({ inside }) => inside);
              const matchesExpectedBlue = ({ rgba }) => rgba.every(
                (channel, index) => Math.abs(channel - state.expectedPixel[index]) <= 2
              );
              if (!interiorPixels.some(matchesExpectedBlue)) {
                throw new Error(`expected blue ${state.expectedPixel} inside rectangle; samples: ${JSON.stringify(state.pixels)}`);
              }
              const backgroundPixel = state.pixels.find(({ inside }) => !inside);
              if (!backgroundPixel || backgroundPixel.rgba.some((channel) => channel !== 0)) {
                throw new Error(`expected transparent background outside rectangle; sample: ${JSON.stringify(backgroundPixel)}`);
              }
              if (state.glErrorsAfterRead.length) {
                throw new Error(`WebGL errors during readback: ${state.glErrorsAfterRead.join(", ")}`);
              }
            });
            await checkpoint("check browser console errors", async () => {
              if (browserErrors.length) {
                throw new Error(`browser console errors: ${browserErrors.join(" | ")}`);
              }
            });

            status.dataset.status = "passed";
            status.textContent = JSON.stringify({
              lastPassedStage,
              webglVersion: state.webglVersion,
              webglRenderer: state.webglRenderer,
              framebuffer: state.framebufferAfterRender,
              framebufferStatus: state.framebufferStatus,
              viewport: state.viewportAtReadback,
              expectedPixel: state.expectedPixel,
              pixels: state.pixels,
              glErrors: {
                afterContext: state.glErrorsAfterContext,
                afterInit: state.glErrorsAfterInit,
                afterRender: state.glErrorsAfterRender,
                afterRead: state.glErrorsAfterRead,
              },
              browserErrors,
            }, null, 2);
          } catch (error) {
            status.dataset.status = "failed";
            status.textContent = JSON.stringify({
              lastPassedStage,
              failedStage: stage,
              error: String(error?.stack ?? error),
              webglAvailable: gl !== null,
              moduleState: state,
              browserErrors,
            }, null, 2);
          }
          </script>
          HTML

          npm ci
          node --experimental-strip-types --test ../test/p0.4/react-runtime/fixture-adapter.test.mjs
          node --experimental-strip-types --test ../test/p0.5/renderer-scene-contract/scene-boundary.test.mjs
          npm run build
          ./node_modules/.bin/vite build --config vite.renderer-smoke.config.ts

          for asset in render-wasm.js render-wasm.wasm worker/render.js shared.js; do
            test -s "build/js/$asset"
          done

          chrome_bin="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$chrome_bin" ]]; then
            echo "ERROR: No headless Chrome/Chromium binary is installed on this runner" >&2
            exit 1
          fi

          ./node_modules/.bin/vite preview --host 127.0.0.1 --port 4173 \
            >"$RUNNER_TEMP/logos-vite-preview.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4173/renderer-smoke.html >/dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/renderer-smoke.html >/dev/null

          "$chrome_bin" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --enable-webgl \
            --disable-features=WebGPU \
            --ignore-gpu-blocklist \
            --use-gl=angle \
            --use-angle=swiftshader \
            --enable-unsafe-swiftshader \
            --virtual-time-budget=15000 \
            --dump-dom http://127.0.0.1:4173/renderer-smoke.html \
            >"$RUNNER_TEMP/renderer-smoke-dom.html" \
            2>"$RUNNER_TEMP/renderer-smoke-chrome.log"
          if ! grep -q 'data-status="passed"' "$RUNNER_TEMP/renderer-smoke-dom.html"; then
            cat "$RUNNER_TEMP/renderer-smoke-dom.html"
            cat "$RUNNER_TEMP/renderer-smoke-chrome.log"
            exit 1
          fi

          ./node_modules/.bin/vite preview --config vite.renderer-smoke.config.ts \
            --host 127.0.0.1 --port 4174 \
            >"$RUNNER_TEMP/logos-react-renderer-preview.log" 2>&1 &
          react_server_pid=$!
