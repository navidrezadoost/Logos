name: logos-app CI

on:
  push:
    branches: ["main", "phase3/**", "phase4/**"]
    paths:
      - "logos-app/**"
      - "render-wasm/**"
      - ".github/workflows/logos-app.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "logos-app/**"
      - "render-wasm/**"

jobs:
  typecheck-and-test:
    name: TypeScript check + Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: logos-app

      - name: Run unit tests (vitest)
        run: npx vitest run
        working-directory: logos-app

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: ESLint
        run: npx eslint src --max-warnings=0
        working-directory: logos-app

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: typecheck-and-test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: Vite production build
        run: npm run build
        working-directory: logos-app

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: logos-app-dist
          path: logos-app/dist/
          retention-days: 7
