name: logos-app CI

on:
  push:
    branches: ["main", "phase3/**", "phase4/**", "r1/**"]
    paths:
      - "logos-app/**"
      - "render-wasm/**"
      - ".github/workflows/logos-app.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "logos-app/**"
      - "render-wasm/**"
      - ".github/workflows/logos-app.yml"

jobs:
  build:
    name: Build the React app
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: Production build (includes TypeScript project check)
        run: npm run build
        working-directory: logos-app

      - name: Sync deployable SPA artifact
        run: python scripts/sync-spa-to-dist.py
        working-directory: logos-app

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: logos-app-dist
          path: logos-app/dist/
          retention-days: 7
