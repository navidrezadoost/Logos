name: Memory Regression Benchmark

# P1.7 — CI safety net against heap regressions.
#
# Scheduled nightly and on manual dispatch. Not triggered on every push to
# avoid the cost of starting the full Logos stack on each commit — the
# benchmark runs after nightly integration tests confirm the build is healthy.
#
# On failure: the job exits non-zero; GitHub will mark the run as failed and
# send a notification. Heap snapshots are uploaded as artifacts and can be
# loaded in Chrome DevTools for inspection.
#
# Reference: *Systems Performance* (Brendan Gregg) — "Measure first; optimise
# second. Without metrics you are flying blind."

on:
  schedule:
    # Run at 02:00 UTC nightly (off-peak; long-running benchmark is acceptable)
    - cron: "0 2 * * *"

  # Allow manual trigger with optional file regeneration
  workflow_dispatch:
    inputs:
      regenerate_file:
        description: "Regenerate the benchmark .logos file before testing"
        required: false
        default: "false"
        type: boolean

env:
  LOGOS_URL:      "http://localhost:6060"
  LOGOS_EMAIL:    "benchmark@logos.test"
  LOGOS_PASSWORD: "benchmark123!"
  BENCHMARK_FILE: "test/benchmarks/fixtures/large-canvas.logos"

jobs:
  memory-benchmark:
    name: Memory Profiling Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Go toolchain (for backend binary + fixture generator) ─────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend-go/go.mod
          cache-dependency-path: backend-go/go.sum

      # ── Cache Docker layers ────────────────────────────────────────────────
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.docker-cache
          key: ${{ runner.os }}-docker-${{ hashFiles('docker/**', 'logos-app/package.json') }}
          restore-keys: |
            ${{ runner.os }}-docker-

      # ── Start Logos services via Docker Compose ───────────────────────────
      - name: Start Logos services
        run: |
          docker compose -f docker/devenv/docker-compose.yaml up -d \
            postgres redis minio
        timeout-minutes: 10

      # ── Build and start the Go backend ────────────────────────────────────
      - name: Build Go backend
        working-directory: backend-go
        run: go build -o ../bin/logos-backend ./cmd/server

      - name: Start Go backend
        run: |
          DATABASE_URL="postgres://logos:logos@localhost:5432/logos" \
          REDIS_URL="redis://localhost:6379/0" \
          BACKEND_GO_ADDR=":6060" \
          ./bin/logos-backend &

      # ── Wait for health ────────────────────────────────────────────────────
      - name: Wait for backend health
        run: |
          echo "Waiting for Logos backend to become healthy …"
          for i in $(seq 1 60); do
            if curl -sf "$LOGOS_URL/api/_health" > /dev/null 2>&1; then
              echo "Backend ready after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "ERROR: Backend did not become healthy within 60s"
              exit 1
            fi
            sleep 2
          done

      # ── Create benchmark user (idempotent) ────────────────────────────────
      - name: Create benchmark test user
        run: |
          curl -sf -X POST "$LOGOS_URL/api/rpc/command/register-profile" \
            -H "Content-Type: application/json" \
            -d '{"email":"'"$LOGOS_EMAIL"'","password":"'"$LOGOS_PASSWORD"'","fullName":"Benchmark User"}' \
            || true

      # ── Cache generated benchmark fixture ────────────────────────────────
      - name: Cache benchmark fixture
        id: cache-fixture
        uses: actions/cache@v4
        with:
          path: test/benchmarks/fixtures
          key: benchmark-fixture-go-${{ hashFiles('backend-go/cmd/gen-benchmark/**', 'backend-go/internal/binfile/**') }}

      - name: Generate benchmark file
        if: steps.cache-fixture.outputs.cache-hit != 'true' || inputs.regenerate_file == 'true'
        working-directory: backend-go
        run: |
          mkdir -p ../test/benchmarks/fixtures
          go run ./cmd/gen-benchmark \
            --output ../test/benchmarks/fixtures/large-canvas.logos \
            --pages 10 \
            --objects 500
          echo "Generated fixture:"
          ls -lh ../test/benchmarks/fixtures/large-canvas.logos

      # ── Set up Node + Playwright ───────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: test/benchmarks/package.json

      - name: Install Node dependencies
        working-directory: test/benchmarks
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: test/benchmarks
        run: npx playwright install chromium --with-deps

      # ── Run the memory benchmark ───────────────────────────────────────────
      - name: Run memory profiling benchmark
        working-directory: test/benchmarks
        run: node memory_profile.js
        env:
          LOGOS_URL:      ${{ env.LOGOS_URL }}
          LOGOS_EMAIL:    ${{ env.LOGOS_EMAIL }}
          LOGOS_PASSWORD: ${{ env.LOGOS_PASSWORD }}
          BENCHMARK_FILE: ${{ github.workspace }}/test/benchmarks/fixtures/large-canvas.logos

      # ── Upload artifacts ───────────────────────────────────────────────────
      - name: Upload heap snapshots and report
        uses: actions/upload-artifact@v4
        if: always()   # upload even on failure for post-mortem inspection
        with:
          name: heap-snapshots-${{ github.run_number }}
          path: |
            test/benchmarks/snapshots/
          retention-days: 30

      # ── Tear down services ─────────────────────────────────────────────────
      - name: Tear down services
        if: always()
        run: |
          pkill logos-backend || true
          docker compose -f docker/devenv/docker-compose.yaml down -v
