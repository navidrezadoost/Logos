name: generated-types drift check

on:
  push:
    branches: ["main", "phase-cs2/**", "phase3/**", "phase4/**", "go/**"]
    paths:
      - "rust/logos-types/**"
      - "bin/generate-types"
      - "logos-app/src/types/generated/**"
      - "logos-app/src/types/rust-generated/**"
      - ".github/workflows/typecheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "rust/logos-types/**"
      - "bin/generate-types"
      - "logos-app/src/types/generated/**"
      - "logos-app/src/types/rust-generated/**"

jobs:
  generated-types-drift:
    name: Verify generated types are up-to-date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check for Rust-generated type drift
        run: make generate-rust-types CHECK=1
        # Exit code 1 if any rust-generated .ts file differs.
        # Fix by running `make generate-rust-types` locally and committing.

  typecheck:
    name: TypeScript type-check (logos-app)
    runs-on: ubuntu-latest
    needs: generated-types-drift

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: logos-app
