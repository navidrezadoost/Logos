name: generated-types drift check

on:
  push:
    branches: ["main", "phase-cs2/**", "phase3/**", "phase4/**"]
    paths:
      - "common/src/app/common/types/**"
      - "common/src/app/common/files/changes.clj"
      - "bin/generate-types"
      - "logos-app/src/types/generated/**"
      - ".github/workflows/typecheck.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "common/src/app/common/types/**"
      - "common/src/app/common/files/changes.clj"
      - "bin/generate-types"
      - "logos-app/src/types/generated/**"

jobs:
  generated-types-drift:
    name: Verify generated types are up-to-date
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Babashka
        uses: turtlequeue/setup-babashka@v1.6.0
        with:
          babashka-version: "1.3.191"

      - name: Check for schema drift
        run: bin/generate-types --check
        # Exit code 1 if any .d.ts file differs from what would be generated.
        # Fix by running `bin/generate-types` locally and committing the results.

  typecheck:
    name: TypeScript type-check (logos-app)
    runs-on: ubuntu-latest
    needs: generated-types-drift

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: logos-app/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: logos-app

      - name: TypeScript type-check
        run: npx tsc --noEmit
        working-directory: logos-app
