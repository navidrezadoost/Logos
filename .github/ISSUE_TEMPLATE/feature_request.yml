name: Feature Request
description: Suggest a new feature or improvement for Logos
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        We'd love to hear your ideas! Please describe the feature you'd like to see in Logos.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which area of Logos does this relate to?
      options:
        - Core Engine
        - Layout & Rendering
        - Desktop UI
        - Text & Typography
        - Collaboration
        - Plugin System
        - File Import/Export
        - Marketplace
        - AI Engine
        - WASM / Web Platform
        - Developer Experience
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: How important is this to you?
      options:
        - Nice to have
        - Important — affects my workflow
        - Critical — blocking my use of Logos
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: "Is your feature request related to a problem? Describe it clearly."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: "Describe the solution you'd like to see."
      placeholder: "It would be great if Logos could..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: "Have you considered any alternative solutions or workarounds?"

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / Examples
      description: "If applicable, add mockups, screenshots, or links to similar features in other tools."

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      description: "Would you be willing to help implement this feature?"
      options:
        - label: I would be willing to submit a PR for this feature
        - label: I can provide test cases or design feedback
