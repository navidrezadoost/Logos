[package]
name = "logos-comments"
version = "0.1.0"
edition = "2021"
description = "Comments, annotations, @mentions, and notifications for Logos — real-time collaborative design feedback with conflict resolution"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
bincode = { version = "2.0.1", features = ["serde"] }

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "comment_benchmark"
harness = false
