[package]
name = "logos-perf"
version = "0.1.0"
edition = "2021"
description = "Performance primitives for the Logos design tool — object pools, buffer management, caching, profiling"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4"] }
log = "0.4.29"
bytemuck = { version = "1.25.0", features = ["derive"] }
rustc-hash = "2.1"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[[bench]]
name = "perf_benchmark"
harness = false
