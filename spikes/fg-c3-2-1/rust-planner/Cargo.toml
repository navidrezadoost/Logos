[package]
name = "fg-c3-2-1-rust-planner-spike"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = []

[dependencies]
logos-types = { path = "../../../rust/logos-types", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v5"] }
wasm-bindgen = "0.2"
