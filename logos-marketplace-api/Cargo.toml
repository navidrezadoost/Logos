[package]
name = "logos-marketplace-api"
version = "0.1.0"
edition = "2021"
description = "REST API server for Logos Marketplace — plugin submission, discovery, publisher verification"

[dependencies]
logos-core = { path = "../logos-core" }
logos-marketplace-auth = { path = "../logos-marketplace-auth" }
logos-marketplace-db = { path = "../logos-marketplace-db" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "api_benchmark"
harness = false
