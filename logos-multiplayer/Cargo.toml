[package]
name = "logos-multiplayer"
version = "0.1.0"
edition = "2021"
description = "Real-time multiplayer collaboration prototype — op-based sync, presence, convergence, and offline support"

[dependencies]
logos-identity = { path = "../logos-identity" }
logos-replay = { path = "../logos-replay" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "multiplayer_benchmark"
harness = false
