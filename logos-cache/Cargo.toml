[package]
name = "logos-cache"
version = "0.1.0"
edition = "2021"
description = "Native in-memory cache, session store, and WebSocket pub/sub broker — replaces Redis/Valkey entirely."

[dependencies]
moka          = { version = "0.12", features = ["future"] }
dashmap       = "6"
tokio         = { version = "1.49", features = ["full"] }
tokio-stream  = "0.1"
futures-util  = "0.3"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
uuid          = { version = "1.20", features = ["v4", "serde"] }
thiserror     = "2"
log           = "0.4"

[dev-dependencies]
tokio         = { version = "1.49", features = ["full", "test-util"] }
