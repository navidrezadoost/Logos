[package]
name = "logos-agent-sso"
version = "0.1.0"
edition = "2021"
description = "Enterprise SSO for Logos Agents — SAML 2.0, OIDC, JWT session management, and RBAC"
authors = ["Logos Contributors"]
license = "MPL-2.0"

[dependencies]
thiserror = "2"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
base64 = "0.22"
sha2 = "0.10"
