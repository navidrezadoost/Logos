[package]
name = "logos-plugins"
version = "0.1.0"
edition = "2021"
description = "Sandboxed plugin runtime for Logos design tool"

[dependencies]
logos-core = { path = "../logos-core" }
boa_engine = { version = "0.21.0", features = ["annex-b"] }
boa_gc = "0.21.0"
log = "0.4.29"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
uuid = { version = "1.20.0", features = ["v4", "serde"] }
wasmtime = "29"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "plugin_benchmark"
harness = false
